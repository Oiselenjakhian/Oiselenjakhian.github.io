<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		<title>Mineral Resources Map of Nigeria</title>
		<link rel="stylesheet" href="css/styles.css"/>
		<script src="js/d3.v7.min.js" type="text/javascript"></script>
	</head>
	
	<body>
		<div class="app-container">
			<!-- Side Panel -->
			<div class="side-panel">
				<div id="state-details-container" style="display: none;">
					<h2 id="details-state-name" style="margin-top: 0; color: #008751;">State Name</h2>
					<p style="font-weight: bold; margin-bottom: 8px; color: #555;">Natural Resource Endowments:</p>
					<ul id="details-resource-list" style="padding-left: 20px; line-height: 1.6;">
					</ul>
				</div>
			
				<!-- Text Area for Search -->	
				<input type="text" id="search" name="search" placeholder="Search for a state or resource (e.g Gold, Kogi)">
				
				<h2>Region</h2>
				<select name="region" id="region">
					<option value="">Please select a region</option>
					<option value="nc">North Central</option>
					<option value="ne">North East</option>
					<option value="nw">North West</option>
					<option value="se">South East</option>
					<option value="ss">South South</option>
					<option value="sw">South West</option>
				</select>
				
				<h2>State</h2>
				<select name="state" id="state">
					<option value="">Please select a state</option>
					<option value="Abia">Abia State</option>
					<option value="Adamawa">Adamawa State</option>
					<option value="Akwa Ibom">Akwa Ibom State</option>
					<option value="Anambra">Anambra State</option>
					<option value="Bauchi">Bauchi State</option>
					<option value="Bayelsa">Bayelsa State</option>
					<option value="Benue">Benue State</option>
					<option value="Borno">Borno State</option>
					<option value="Cross River">Cross River State</option>
					<option value="Delta">Delta State</option>
					<option value="Ebonyi">Ebonyi State</option>
					<option value="Edo">Edo State</option>
					<option value="Ekiti">Ekiti State</option>
					<option value="Enugu">Enugu State</option>	
					<option value="Federal Capital Territory">Federal Capital Territory</option>
					<option value="Gombe">Gombe State</option>
					<option value="Imo">Imo State</option>
					<option value="Jigawa">Jigawa State</option>
					<option value="Kaduna">Kaduna State</option>
					<option value="Kano">Kano State</option>
					<option value="Katsina">Katsina State</option>
					<option value="Kebbi">Kebbi State</option>
					<option value="Kogi">Kogi State</option>
					<option value="Kwara">Kwara State</option>
					<option value="Lagos">Lagos State</option>
					<option value="Nasarawa">Nasarawa State</option>
					<option value="Niger">Niger State</option>
					<option value="Ogun">Ogun State</option>
					<option value="Ondo">Ondo State</option>
					<option value="Osun">Osun State</option>
					<option value="Oyo">Oyo State</option>
					<option value="Plateau">Plateau State</option>
					<option value="Rivers">Rivers State</option>
					<option value="Sokoto">Sokoto State</option>
					<option value="Taraba">Taraba State</option>
					<option value="Yobe">Yobe State</option>
					<option value="Zamfara">Zamfara State</option>
				</select>
				
				<!-- Attribution -->
				<p class="panel-attribution">Made with ❤️ in Lagos, Nigeria by <a href="https://x.com/trustonailende" target="_blank" rel="noopener">Truston Ailende</a>. Special thanks to <a href="https://x.com/FinPlanKaluAja1" target="_blank" rel="noopener">Kalu Aja</a> for sharing the original image.</p>
			</div>
			
			<!-- Map Container -->
			<div class="map-container">
				<div id="map-controls">
					<button id="zoom-in-button" class="button" type="button">+</button>
					<button id="zoom-out-button" class="button" type="button">-</button>
				</div>
				<div id="map"></div>
			</div>
		</div>
		
		<div id="tooltip" style="position: absolute; opacity: 0; pointer-events: none;"></div>
		<script src="js/app.js" type="text/javascript"></script>
	</body>
</html>
